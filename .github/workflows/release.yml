name: Build and release macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test EPUB parsing and translations
        run: ./test.sh
      - name: Test actual WebKit highlights and note bridge
        run: ./test-web.sh
      - name: Build and package universal app
        run: ./package.sh
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: zsh {0}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "${GITHUB_REF_NAME}" == "v${VERSION}" ]]
      - name: Preserve installable application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Folio-macOS-universal
          path: dist/*
      - name: Publish downloadable release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Folio $VERSION" --notes-file RELEASE-NOTES.md "dist/Folio-$VERSION-macOS-universal.zip" dist/Folio-macOS-universal.zip dist/SHA256SUMS
